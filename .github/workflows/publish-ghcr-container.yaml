name: Publish multiarch images on ghcr.io
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish when running this workflow manually
        required: true
        type: string
  push:
    tags:
      - '*'

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push Spilo multiarch images
    runs-on: ubuntu-22.04
    permissions:
      contents: 'read'
      packages: 'write'
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up packages
      run: sudo apt-get install -y docker-compose

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Derive spilo image name
      id: image
      working-directory: postgres-appliance
      env:
        MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        PGVERSION=$(sed -n 's/^ARG PGVERSION=\([1-9][0-9]*\).*$/\1/p' Dockerfile)
        if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
          IMAGE_TAG="$MANUAL_IMAGE_TAG"
        else
          IMAGE_TAG="$GITHUB_REF_NAME"
        fi
        if [[ "$IMAGE_TAG" == *-supabase ]]; then
          IMAGE_TAG="${IMAGE_TAG%-supabase}"
        fi
        if [[ -z "$IMAGE_TAG" ]]; then
          echo "ERROR: derived image tag is empty" >&2
          exit 1
        fi
        IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-$PGVERSION"
        echo "NAME=${IMAGE_BASE}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "SUPABASE_NAME=${IMAGE_BASE}:${IMAGE_TAG}-supabase" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and export to local docker for testing
      uses: docker/build-push-action@v7
      with:
        context: "postgres-appliance/"
        load: true
        tags: ${{ steps.image.outputs.NAME }}
        cache-from: type=gha,scope=spilo-build
        cache-to: type=gha,scope=spilo-build,mode=max

    - name: Build and export Supabase-default image for smoke testing
      uses: docker/build-push-action@v7
      with:
        context: "postgres-appliance/"
        load: true
        tags: ${{ steps.image.outputs.SUPABASE_NAME }}
        build-args: |
          ENABLE_SUPABASE_EXTENSIONS_DEFAULT=true
        cache-from: |
          type=gha,scope=spilo-build
          type=gha,scope=spilo-supabase-build
        cache-to: type=gha,scope=spilo-supabase-build,mode=max

    - name: Smoke test Supabase-default image metadata
      run: |
        docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${{ steps.image.outputs.SUPABASE_NAME }}" | grep '^ENABLE_SUPABASE_EXTENSIONS=true$'
        docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${{ steps.image.outputs.SUPABASE_NAME }}" | grep '^ENABLE_SUPABASE_INIT=false$'

    - name: Test container images
      env:
        SPILO_TEST_IMAGE: "${{ steps.image.outputs.NAME }}"
      run: bash postgres-appliance/tests/test_spilo.sh

    - name: Test Supabase bootstrap image
      env:
        SPILO_TEST_IMAGE: "${{ steps.image.outputs.SUPABASE_NAME }}"
        SPILO_SUPABASE_TEST_IMAGE: "${{ steps.image.outputs.SUPABASE_NAME }}"
      run: bash postgres-appliance/tests/test_supabase.sh

    - name: Build arm64 additionaly and push multiarch image to ghcr
      uses: docker/build-push-action@v7
      with:
        context: "postgres-appliance/"
        push: true
        tags: "${{ steps.image.outputs.NAME }}"
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=spilo-build
        cache-to: type=gha,scope=spilo-build,mode=max

    - name: Build arm64 additionaly and push Supabase-default multiarch image to ghcr
      uses: docker/build-push-action@v7
      with:
        context: "postgres-appliance/"
        push: true
        tags: "${{ steps.image.outputs.SUPABASE_NAME }}"
        platforms: linux/amd64,linux/arm64
        build-args: |
          ENABLE_SUPABASE_EXTENSIONS_DEFAULT=true
        cache-from: |
          type=gha,scope=spilo-build
          type=gha,scope=spilo-supabase-build
        cache-to: type=gha,scope=spilo-supabase-build,mode=max
