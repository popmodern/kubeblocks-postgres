name: ubuntu

on: 
  pull_request:
  push:
    branches:
    - master
    - trigger
    - support-supabase-extensions-and-tables
  workflow_dispatch:
    inputs:
      run_locales_test:
        description: Run the USE_OLD_LOCALES test suite
        required: false
        default: true
        type: boolean

jobs:
  tests:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
    - name: Set up packages
      run: sudo apt-get install -y shellcheck docker-compose
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install flake8
      run: python -m pip install flake8
    - name: Run shellcheck
      run: find postgres-appliance -name '*.sh' -print0 | xargs -0 shellcheck
    - name: Run flake8
      run: find postgres-appliance -name '*.py' -print0 | xargs -0 python -m flake8
    - name: Build spilo docker image
      run: cd postgres-appliance && docker build -t spilo .
    - name: Build Supabase-default docker image
      run: cd postgres-appliance && docker build --build-arg ENABLE_SUPABASE_EXTENSIONS_DEFAULT=true -t spilo-supabase .
    - name: Smoke test Supabase-default docker image metadata
      run: |
        docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' spilo-supabase | grep '^ENABLE_SUPABASE_EXTENSIONS=true$'
        docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' spilo-supabase | grep '^ENABLE_SUPABASE_INIT=false$'
    - name: Test spilo docker image
      env:
        SPILO_TEST_IMAGE: spilo
        SPILO_SUPABASE_TEST_IMAGE: spilo-supabase
      run: bash postgres-appliance/tests/test_spilo.sh
    - name: Test USE_OLD_LOCALES
      run: bash -x postgres-appliance/tests/locales_test/test_locales.sh
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_locales_test)
